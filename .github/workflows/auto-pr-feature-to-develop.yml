name: Auto PR (feature -> develop)

on:
  push:
    branches:
      - "feature/**"

env:
  solutionname: ./src/PorExtenso.sln
  secret: ${{ secrets.SONAR_TOKEN_PE }}

jobs:
  Warm-up:
    runs-on: ubuntu-latest   # ← Runner gratuito do GitHub
    permissions:
      contents: read

    steps:
      - name: Ensure or install GitHub CLI (gh)
        run: |
          if command -v gh >/dev/null 2>&1; then
            echo "gh já instalado"
            gh --version
            exit 0
          fi
          echo "gh não encontrado — tentando instalar via apt..."
          set -eux
          sudo apt update
          sudo apt install -y curl apt-transport-https gnupg
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
          sudo chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
          sudo apt update
          sudo apt install -y gh
          gh --version

  Tests:
    needs: Warm-up
    runs-on: ubuntu-latest   # ← Runner gratuito do GitHub
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore ${{env.solutionname}}

      - name: Validate tests
        run: dotnet test ${{env.solutionname}} --configuration Release --verbosity normal


  Sonar:
    needs: Tests
    name: Build and analyze
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          java-version: 17
          distribution: 'zulu' # Alternative distribution options are available.

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis

      - name: Cache SonarQube Cloud packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~\sonar\cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache SonarQube Cloud scanner
        id: cache-sonar-scanner
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}\scanner
          key: ${{ runner.os }}-sonar-scanner
          restore-keys: ${{ runner.os }}-sonar-scanner

      - name: Install SonarQube Cloud scanner
        if: steps.cache-sonar-scanner.outputs.cache-hit != 'true'
        shell: powershell
        run: |
          New-Item -Path ${{ runner.temp }}\scanner -ItemType Directory
          dotnet tool update dotnet-sonarscanner --tool-path ${{ runner.temp }}\scanner

      - name: Build and analyze
        shell: powershell
        run: |
          ${{ runner.temp }}\scanner\dotnet-sonarscanner begin /k:"laikha_PorExtenso" /o:"laikha" /d:sonar.token="${{env.secret}}"
          dotnet build

  Open-PR:
    needs: Sonar
    runs-on: ubuntu-latest   # ← Runner gratuito do GitHub
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create PR if missing (${{ github.ref_name }} -> develop)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.ref_name }}
        run: |
          echo "Branch atual: $BRANCH"

          PR_NUMBER=$(gh pr list --state open --head "$BRANCH" --base "develop" --json number --jq '.[0].number' 2>/dev/null || echo "")
          if [ -n "$PR_NUMBER" ] && [ "$PR_NUMBER" != "null" ]; then
            echo "PR já existe (#$PR_NUMBER). Nada a fazer."
            exit 0
          fi

          gh pr create \
            --base "develop" \
            --head "$BRANCH" \
            --title "feat: auto PR $BRANCH -> develop" \
            --body "PR auto-criado via GitHub Actions ($BRANCH -> develop)."

          NEW_PR=$(gh pr list --state open --head "$BRANCH" --base "develop" --json number --jq '.[0].number')
          echo "Criado PR #$NEW_PR"

          gh pr edit "$NEW_PR" --add-label "automated" 2>/dev/null || true
          gh pr edit "$NEW_PR" --add-label "feature" 2>/dev/null || true